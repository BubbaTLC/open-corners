[package]
name = "open-corners"
version = "0.1.0"
edition = "2024"
description = "macOS-style hot corners for Wayland Linux desktops (COSMIC, Sway, Hyprland, KDE, etc.)"

[dependencies]
anyhow = "1"
calloop = "0.13"
calloop-wayland-source = "0.3"
clap = { version = "4", features = ["derive"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11", "glow", "default_fonts"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
toml = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
